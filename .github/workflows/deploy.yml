name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  # Lets a full deploy (and, critically, the guide-PDF backfill below) be
  # re-run manually without a new commit — e.g. to force-regenerate guide
  # PDFs whose R2 key didn't change across a content update, so the normal
  # skip-if-exists backfill left the stale file in place.
  workflow_dispatch:
    inputs:
      force_guides:
        description: 'Force-regenerate every pre-generated guide PDF, even ones already in R2'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (not the default shallow depth-1 clone) — the
          # sitemap's lastmod dates are derived from `git log` per content
          # file at build time, which needs real history to find anything.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}

      # Pings Bing/Yandex/etc so new or changed pages get (re)indexed promptly
      # instead of waiting for a crawl. Non-fatal — a submission hiccup here
      # shouldn't fail an otherwise-successful deploy.
      - run: npm run submit-indexnow
        continue-on-error: true

      # Eagerly backfills the pre-generated public guide PDFs (the
      # consolidated Kilimanjaro trekking guide + the generic sample
      # itinerary guide, one of each per locale — see
      # src/app/api/cron/generate-guides/route.ts) against the now-live
      # Worker. Skip-if-exists on the server side means a normal push-
      # triggered run only ever renders genuinely new/missing combinations
      # — which also means a content change that reuses an existing R2 key
      # (e.g. a guide's design was replaced but its key wasn't) won't get
      # picked up here on its own; re-run this workflow manually with
      # force_guides=true when that happens. Non-fatal — this never blocks
      # a deploy that already succeeded; pdf-lead has its own request-time
      # fallback for anything this hasn't caught up to yet.
      - name: Backfill public guide PDFs
        continue-on-error: true
        timeout-minutes: 90
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE_GUIDES: ${{ github.event.inputs.force_guides }}
        run: |
          cursor=0
          batch=1
          force_qs=""
          if [ "${FORCE_GUIDES}" = "true" ]; then force_qs="&force=true"; fi
          while true; do
            resp=$(curl -sf -X POST \
              "https://www.theextremewilderness.com/api/cron/generate-guides?cursor=${cursor}&limit=10${force_qs}" \
              -H "Authorization: Bearer ${CRON_SECRET}")
            processed=$(echo "$resp" | jq -r '.processed')
            skipped=$(echo "$resp" | jq -r '.skipped')
            next=$(echo "$resp" | jq -r '.nextCursor')
            total=$(echo "$resp" | jq -r '.total')
            done_flag=$(echo "$resp" | jq -r '.done')
            errors=$(echo "$resp" | jq -c '.errors')
            echo "batch ${batch}: cursor=${cursor}/${total} processed=${processed} skipped=${skipped} errors=${errors}"
            if [ "$done_flag" = "true" ]; then
              echo "Guide backfill complete."
              break
            fi
            cursor=$next
            batch=$((batch + 1))
          done
